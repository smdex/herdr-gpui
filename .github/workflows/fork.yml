name: Fork

# Fork-only CI for smdex/herdr-gpui. Upstream's workflows gate on
# sheprd-labs/sheprd and penso/herdr-gpui, so the twice-daily auto-rebase
# this fork performs skips every upstream Nix job. This workflow runs the
# fork's own regressions (the sync script's isolated git-plumbing tests and
# the Nix companions check), the cheap repo gates, and builds the fork's
# Nix packages after every push, pull request,
# and manual run, using the same pinned Nix install action as
# .github/workflows/nix.yml. It is additive: upstream gates are untouched,
# and nothing here runs on sheprd-labs/sheprd. No paths filter: a rebase
# that only moves lockfiles or source must still be built.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork:
    if: github.repository == 'smdex/herdr-gpui'
    name: Fork regression and Nix packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the sync script's isolated regression tests
        run: python3 scripts/ci/test_sync_upstream.py -v
      - name: Check the repo's cheap gates
        run: |
          bash scripts/check-file-size.sh
          python3 scripts/check-sorted.py
          python3 scripts/check-i18n.py
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check the flake's structure and companions
        run: |
          bash scripts/check-nix-companions.sh
          nix eval --impure --raw --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs {
                system = "x86_64-linux";
                overlays = [ flake.overlays.default ];
              };
            in pkgs.sheprd.drvPath'
      - name: Check the flake and build the fork's packages in the Nix sandbox
        run: |
          nix flake check --no-build --all-systems
          nix build -L --no-link .#sheprd .#sheprd-acp .#sheprd-remote-control .#sheprd-automate
      - name: Run the built executable's CLI without a desktop
        run: |
          # Cheap: everything is already in the store, this only links result.
          nix build -L .#sheprd
          ./result/bin/sheprd --help >/dev/null
          ./result/bin/herdr-gpui --help >/dev/null
          test "$(readlink result/bin/herdr-gpui)" = sheprd
          for helper in acp automate nearby remote-control; do
            test "$(readlink "result/bin/herdr-$helper")" = "sheprd-$helper"
            test -x "result/bin/herdr-$helper"
          done
          test -f result/share/applications/org.sheprd.Sheprd.desktop
      - name: Check standalone companion execution and runtime isolation
        run: |
          bundle=$(readlink -f result)
          for program in sheprd-acp sheprd-remote-control sheprd-automate; do
            output=$(nix build --no-link --print-out-paths ".#$program")
            test -f "$output/bin/$program"
            test ! -L "$output/bin/$program"
            closure=$(nix-store --query --requisites "$output")
            if grep -Fx "$bundle" <<<"$closure"; then
              echo "Standalone $program retains the GUI bundle" >&2
              exit 1
            fi
            "$output/bin/$program" --help >/dev/null
          done
